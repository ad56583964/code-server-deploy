[code_server]
version = "4.102.3"
port = 8080

[cert]
domain = "code-server.local"         # 主域名 / 证书 CN
host = "code-server.local"           # 兼容字段，脚本优先使用 domain
out_dir = "~/.config/code-server"    # cert.pem / key.pem 输出目录
days = 3650                          # 证书有效期（天）
key_bits = 2048                      # RSA 密钥长度

[cert.subject]
country = "CN"
state = "Zhejiang"
locality = "Hangzhou"
organization = "Example"
organizational_unit = "Code Server"
email = "admin@example.com"

[cert.san]
# 证书 SubjectAltName DNS 列表，不填则默认只包含 domain/host
dns = ["code-server.local"]

[systemd]
# 留空则默认使用当前用户
user = ""
# 不建议把真实密码提交到 git 仓库，这里只是占位示例
password = ""
